<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body{margin:0;width:300px;font:13px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#1f1f1f;background:#fff}
  header{display:flex;align-items:center;gap:10px;padding:14px 16px;background:#0e7490;color:#fff}
  header img{width:28px;height:28px;border-radius:8px}
  header b{font-size:15px}
  main{padding:12px 16px 16px}
  ol{padding-left:18px;margin:6px 0 12px;color:#444}
  .stat{background:#f3f6f8;border-radius:10px;padding:8px 12px;margin-bottom:12px;color:#444}
  a.btn{display:block;text-align:center;text-decoration:none;border-radius:999px;padding:7px 0;margin-top:8px;border:1px solid #d0d7de;color:#1f1f1f}
  a.btn.primary{background:#0e7490;border-color:#0e7490;color:#fff;font-weight:600}
  small{color:#888}
</style>
</head>
<body>
<header><img src="icons/icon48.png" alt=""><div><b>Wavely 1688 采集助手</b><br><small style="color:#c2e7ff" id="ver"></small></div></header>
<main>
  <div class="stat" id="stat">读取中…</div>
  <label style="display:flex;align-items:center;gap:8px;margin-bottom:12px">批量采集间隔
    <input id="delay" type="number" min="0" max="60" step="0.5" style="width:64px;font:inherit;border:1px solid #d0d7de;border-radius:6px;padding:2px 6px"> 秒
    <small id="saved"></small></label>
  <b>怎么用</b>
  <ol>
    <li>在 1688 搜索结果或店铺商品列表，勾选卡片左上角的方框，点「采集」</li>
    <li>或打开商品详情页，点右下角「采集此商品」</li>
    <li>到 ERP 的「1688 采集」里审核、定价，转为草稿商品</li>
  </ol>
  <a class="btn primary" id="erp" target="_blank" rel="noopener">打开 ERP 采集箱</a>
  <a class="btn" href="https://s.1688.com/" target="_blank" rel="noopener">去 1688 选品</a>
  <p><small>只读取你正在浏览的页面，不会自动登录或绕过 1688 的安全验证。</small></p>
</main>
<script type="module" src="popup.js"></script>
</body>
</html>
