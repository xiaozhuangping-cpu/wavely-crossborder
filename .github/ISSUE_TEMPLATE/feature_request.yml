name: 功能建议 / Feature request
description: 希望增加或改进的功能
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      placeholder: 例如：采购单希望支持按供应商合并付款
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: 期望的做法
  - type: textarea
    id: alt
    attributes:
      label: 其他补充
