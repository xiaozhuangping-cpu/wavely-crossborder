# 仓库助手 App：打包 Android APK，上传到固定的 GitHub Release「app-latest」（下载链接不变）
name: Warehouse app APK

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app-release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-release
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter test
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../wavely-warehouse.apk
      - name: Publish to release app-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Wavely 仓库助手（Flutter）安卓安装包，与 Wavely 跨境 ERP 实时同步：扫码收货入库、拣货发货、库存查询。
          演示用调试签名构建（commit ${GITHUB_SHA::7}）。网页版：https://xiaozhuangping-cpu.github.io/wavely-crossborder/app/"
          gh release view app-latest >/dev/null 2>&1 || gh release create app-latest --title "Wavely 仓库助手 App" --notes "$NOTES" --prerelease
          gh release edit app-latest --notes "$NOTES"
          gh release upload app-latest wavely-warehouse.apk --clobber
