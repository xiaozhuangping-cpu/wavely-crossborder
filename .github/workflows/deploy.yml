name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 数据库测试：在空的 Postgres 17（与线上一致）里跑全部迁移 + supabase/tests，失败则不发布
  db-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
      - name: Run migrations and tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: ./supabase/tests/run.sh

  build:
    needs: db-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            erp/package-lock.json
            shop/package-lock.json
      - name: Build ERP
        working-directory: erp
        run: npm ci && npm run build
      - name: Build shop
        working-directory: shop
        run: npm ci && npm run build
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - name: Build warehouse app (Flutter web)
        working-directory: app
        run: |
          flutter pub get
          flutter test
          flutter build web --release --base-href /wavely-crossborder/app/ --no-web-resources-cdn
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r erp/dist _site/erp
          cp -r shop/dist _site/shop
          cp -r app/build/web _site/app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
