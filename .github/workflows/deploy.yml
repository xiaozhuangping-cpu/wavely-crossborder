name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            erp/package-lock.json
            shop/package-lock.json
      - name: Build ERP
        working-directory: erp
        run: npm ci && npm run build
      - name: Build shop
        working-directory: shop
        run: npm ci && npm run build
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r erp/dist _site/erp
          cp -r shop/dist _site/shop
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
